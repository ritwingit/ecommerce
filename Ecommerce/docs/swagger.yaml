openapi: 3.0.0

info:
  title: DarkCart Ecommerce API
  version: 1.0.0
  description: Complete API documentation for the DarkCart Node.js + Express + MongoDB backend.

servers:
  - url: http://localhost:5000
    description: Local development server

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string }
        token: { type: string }

    Product:
      type: object
      required: [title, price, image, category, countInStock]
      properties:
        _id: { type: string }
        title: { type: string }
        price: { type: number }
        image: { type: string }
        category: { type: string }
        countInStock: { type: number }

    CartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: number }

    Cart:
      type: object
      properties:
        _id: { type: string }
        userId: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"

    OrderItem:
      type: object
      properties:
        productId: { type: string }
        qty: { type: number }
        price: { type: number }

    Order:
      type: object
      properties:
        _id: { type: string }
        userId: { type: string }
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalAmount:
          type: number

security:
  - basicAuth: []

paths:
  ###############################################
  # AUTH ROUTES
  ###############################################

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        201:
          description: User created

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login user & get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: User authenticated

